  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran, y compris sous l'encoche (safe areas gérées en CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Globe de voyages</title>
    <meta name="description" content="Mon globe de voyages personnel" />

    <!-- Couleur de la barre d'état, suit le thème clair/sombre de l'iPhone -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />

    <!-- Mode « app » sur l'écran d'accueil iPhone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Globe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
